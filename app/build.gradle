apply plugin: 'com.android.application'

project.ext {
    hasLottie = true
}

android {
    compileSdkVersion 29

    defaultConfig {
        applicationId "com.yangxianwen.health"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
    }

    lintOptions {
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}
repositories {
    flatDir {
        dirs 'libs' //this way we can find the .aar file in libs folder
    }
}
dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation files('libs/libcomx-0.5.jar')
    implementation files('libs/vpbluetooth-1.14.aar')
    implementation files('libs/vpprotocol-2.3.04.15.aar')

    implementation files('libs/JL_Watch_V1.10.0-release.aar')
    implementation files('libs/jl_rcsp_V0.5.2-release.aar')
    implementation files('libs/jl_bt_ota_V1.9.3-release.aar')
    implementation files('libs/BmpConvert_V1.2.1-release.aar')

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.android.support:design:28.0.0-alpha1'
    implementation 'com.orhanobut:logger:1.15'
    implementation 'no.nordicsemi.android.support.v18:scanner:1.4.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    implementation 'com.yanzhenjie.recyclerview:support:1.3.2'
    implementation 'tech.gujin:toast-util:1.2.0'

    implementation 'cn.carbs.android:SegmentControlView:1.0.0'

    //implementation 'androidx.lifecycle:lifecycle-process:2.9.1'

//    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
